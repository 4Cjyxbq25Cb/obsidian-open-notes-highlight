name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          repo="${GITHUB_REPOSITORY}"

          # Release erstellen (löscht vorherige falls vorhanden)
          existing=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$repo/releases/tags/$tag")
          if [ "$existing" = "200" ]; then
            release_id=$(curl -s \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$repo/releases/tags/$tag" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            curl -s -X DELETE \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$repo/releases/$release_id"
          fi

          # Release-Body aus dem passenden CHANGELOG.md-Abschnitt bauen.
          # generate_release_notes bleibt an: GitHub hängt die Commit-Liste
          # unter diesen handgeschriebenen Text. Fehlt der Abschnitt, bleibt der
          # Body leer und es gibt wie bisher nur die generierten Notizen.
          python3 - "$tag" > payload.json <<'PY'
          import json, pathlib, re, sys

          tag = sys.argv[1]
          body = ""
          changelog = pathlib.Path("CHANGELOG.md")
          if changelog.exists():
              text = changelog.read_text(encoding="utf-8")
              match = re.search(rf"^## {re.escape(tag)}\s*$(.*?)(?=^## |\Z)",
                                text, re.M | re.S)
              if match:
                  # Trailing horizontal rule separating this entry from the next
                  body = re.sub(r"\n+-{3,}\s*$", "", match.group(1).strip()).strip()

          json.dump({
              "tag_name": tag,
              "name": tag,
              "body": body,
              "draft": False,
              "prerelease": False,
              "generate_release_notes": True,
          }, sys.stdout)
          PY

          response=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$repo/releases" \
            -d @payload.json)

          upload_url=$(echo "$response" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'].split('{')[0])")

          for file in main.js manifest.json styles.css; do
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "${upload_url}?name=$file" \
              --data-binary @"$file"
          done
